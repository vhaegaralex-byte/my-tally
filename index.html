<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Weekly Tally</title>
  <script>
    (function () {
      var appUrl = new URL('./Weekly%20Tally.html', window.location.href).href;
      function openApp() { window.location.replace(appUrl); }

      if ('serviceWorker' in navigator && /^https?:$/.test(window.location.protocol)) {
        navigator.serviceWorker.register('./sw.js')
          .then(function () { return navigator.serviceWorker.ready; })
          .then(openApp, openApp);
      } else {
        openApp();
      }
    })();
  </script>
</head>
<body>
  <p>Preparing Weekly Tally for offline use…</p>
  <p>If you are not redirected, <a href="./Weekly%20Tally.html">open Weekly Tally</a>.</p>
</body>
</html>
